# CI skeleton for the P0 foundations. The gate order here is the contract:
# a failure in fmt or lint should never cost a test run.
#
# Every action is pinned to a full commit SHA with the version in a comment.
# zizmor (security.yml) fails the build on a tag reference, and a tag is a
# mutable string. The security workflow's own zizmor job is the reason, and it
# runs this file, so a new action here is checked the moment it lands.

name: ci

on:
  push:
    branches: [main]
  pull_request:

# One run per ref. A second push to a branch supersedes the first: two CI runs
# racing over the same branch is the shape where a red build is read as the
# newer one when it is the older. zizmor flags a workflow with no concurrency
# setting at all, and this is the setting that is actually wanted here.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  # Read the repository and nothing else. No job in this file writes, and a
  # workflow-level grant is what a compromised dependency would inherit.
  contents: read

env:
  GOFLAGS: -mod=readonly
  # Templ is pinned in go.mod via the tool directive; CI uses the same version.
  GO_VERSION: "1.26.0"

jobs:
  fmt-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: gofmt -l . | tee /tmp/fmt.txt; test ! -s /tmp/fmt.txt
      # -fail, not -check. Verified against `go tool templ fmt --help` on the
      # pinned v0.3.1020, which lists -fail ("Fails with exit code 1 if files
      # are changed. (e.g. in CI)") and no -check. The -check spelling this
      # step used to run exits 2 with "flag provided but not defined" before
      # it formats anything, so the job was red on a clean tree. Makefile's
      # fmt-check already spelled it correctly and the two disagreed.
      - name: templ is formatted (v0.3.1020 spells the flag -fail)
        run: go tool templ fmt -fail .

  generate-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go mod download
      - run: go tool templ generate ./...
      - name: generated code is committed and current
        run: git diff --exit-code -- 'internal/**/*_templ.go'

  css-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: install the pinned tailwind CLI
        run: make tools
      - run: make css
      - name: the committed stylesheet is current
        run: git diff --exit-code -- web/static/app.css

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: golangci/golangci-lint-action@7119f3d5ddced62a10a044847a6c6bb0f7a5e76a # v7.0.0
        with:
          version: v2.5.0

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go build ./...
      - name: the release build is a single static file
        run: |
          CGO_ENABLED=0 go build -trimpath -o /tmp/semiplane ./cmd/semiplane
          /tmp/semiplane version
          ldd /tmp/semiplane 2>&1 | grep -qi "not a dynamic executable"
      # The release artifact set is written in two files, so something has to
      # read both. This is that something: it derives goos x goarch out of
      # .goreleaser.yaml and compares the product against the Makefile's
      # TARGETS, which is the check that was missing when the two disagreed on
      # windows/arm64.
      - name: the Makefile and the release config build the same targets
        run: make targets-check
      # .goreleaser.yaml's header says the binary carries its own stylesheet,
      # icon sprite, DataStar bundle and migrations. That sentence had nothing
      # reading it, and it named the sample campaign, which is not embedded.
      # This reads it.
      - name: the binary really does carry its own assets
        run: make embed-check

  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.26.0", "1.27.0"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - run: ./scripts/test.sh
      - name: no test may write into the repository
        run: |
          test -z "$(git status --porcelain)" || \
            (echo "a test wrote into the repository:"; git status --porcelain; exit 1)

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: ./scripts/test.sh -race

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: ./scripts/test.sh -coverprofile=coverage.out -covermode=atomic
      # This step used to be `go tool cover -func=coverage.out | tail -1` under
      # the name "security-relevant packages must not lose coverage". It
      # printed a total, discarded it, and always passed — a gate whose output
      # nobody reads and whose exit code is always zero. AGENTS.md 5 asks for a
      # ratchet, so this is one: a per-package baseline, and a failure that
      # names the package and both numbers. See the header of
      # .coverage-baseline for why a ratchet and not an absolute floor.
      - name: no tracked package lost coverage
        run: make coverage-check
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: coverage
          path: coverage.out
