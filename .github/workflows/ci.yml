# CI skeleton for the P0 foundations. The gate order here is the contract:
# a failure in fmt or lint should never cost a test run.
#
# Every action is pinned to a full commit SHA with the version in a comment.
# zizmor (security.yml) fails the build on a tag reference, and a tag is a
# mutable string. The security workflow's own zizmor job is the reason, and it
# runs this file, so a new action here is checked the moment it lands.

name: ci

on:
  push:
    branches: [main]
  pull_request:

# One run per ref. A second push to a branch supersedes the first: two CI runs
# racing over the same branch is the shape where a red build is read as the
# newer one when it is the older. zizmor flags a workflow with no concurrency
# setting at all, and this is the setting that is actually wanted here.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  # Read the repository and nothing else. No job in this file writes, and a
  # workflow-level grant is what a compromised dependency would inherit.
  contents: read

env:
  GOFLAGS: -mod=readonly
  # Templ is pinned in go.mod via the tool directive; CI uses the same version.
  #
  # 1.26.6, not 1.26.0, and the reason is security.yml's govulncheck job rather
  # than taste. Pinned at 1.26.0, that job reported 16 standard-library
  # vulnerabilities, every one of them fixed in a 1.26.x patch — GO-2026-6090
  # (crypto/tls, net/http, encoding/asn1) needs 1.26.6, GO-2026-5856 (the
  # Encrypted Client Hello privacy leak) needs 1.26.5, and the rest 1.26.1 to
  # 1.26.4. A toolchain below 1.26.6 cannot be made clean by any change to this
  # repository, because the vulnerable code is the toolchain's own standard
  # library. go.mod's `go 1.26.0` directive is a language version and stays: it
  # is a minimum, not a toolchain, and 1.26.6 satisfies it.
  GO_VERSION: "1.26.6"

jobs:
  fmt-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: gofmt -l . | tee /tmp/fmt.txt; test ! -s /tmp/fmt.txt
      # -fail, not -check. Verified against `go tool templ fmt --help` on the
      # pinned v0.3.1020, which lists -fail ("Fails with exit code 1 if files
      # are changed. (e.g. in CI)") and no -check. The -check spelling this
      # step used to run exits 2 with "flag provided but not defined" before
      # it formats anything, so the job was red on a clean tree. Makefile's
      # fmt-check already spelled it correctly and the two disagreed.
      - name: templ is formatted (v0.3.1020 spells the flag -fail)
        run: go tool templ fmt -fail .

  generate-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go mod download
      - run: go tool templ generate ./...
      - name: generated code is committed and current
        run: git diff --exit-code -- 'internal/**/*_templ.go'

  css-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: install the pinned tailwind CLI
        run: make tools
      - run: make css
      - name: the committed stylesheet is current
        run: git diff --exit-code -- web/static/app.css

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # v2.14.0, and the version is the whole fix. golangci-lint refuses to load
      # a config for a module that targets a newer Go language version than the
      # one it was built with — the check is in go/types, which is inside the Go
      # toolchain — so the 2.5.0 pin, built with go1.25, could not read a module
      # with `go 1.26.0` and exited 3 before analysing a single file. The Go
      # team's own rule is that golangci-lint supports the Go versions it was
      # built with, so the version has to move with the toolchain.
      # go1.26 support landed in the v2.9.0 line; v2.14.0 is the current release
      # and reports itself as "built with go1.27.0", which is above the 1.26.6
      # this file pins. tools/versions.env carries the same number for `make lint`.
      - uses: golangci/golangci-lint-action@7119f3d5ddced62a10a044847a6c6bb0f7a5e76a # v7.0.0
        with:
          version: v2.14.0

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go build ./...
      - name: the release build is a single static file
        run: |
          CGO_ENABLED=0 go build -trimpath -o /tmp/semiplane ./cmd/semiplane
          /tmp/semiplane version
          ldd /tmp/semiplane 2>&1 | grep -qi "not a dynamic executable"
      # The release artifact set is written in two files, so something has to
      # read both. This is that something: it derives goos x goarch out of
      # .goreleaser.yaml and compares the product against the Makefile's
      # TARGETS, which is the check that was missing when the two disagreed on
      # windows/arm64.
      - name: the Makefile and the release config build the same targets
        run: make targets-check
      # .goreleaser.yaml's header says the binary carries its own stylesheet,
      # icon sprite, DataStar bundle and migrations. That sentence had nothing
      # reading it, and it named the sample campaign, which is not embedded.
      # This reads it.
      - name: the binary really does carry its own assets
        run: make embed-check

  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.26.6", "1.27.0"]
    runs-on: ${{ matrix.os }}
    # Both steps in this job are POSIX shell, and both were being handed to
    # pwsh on windows-latest because a job inherits the runner's default shell
    # (pwsh there, bash elsewhere) and nothing here overrode it.
    #
    # The first one failed loudly and was easy to read: `test -z "$(...)" || ( … )`
    # is a PowerShell ParserError, "Missing closing ')' in expression".
    #
    # The second one is the reason this is a job-level default and not a
    # per-step `shell:`. `./scripts/test.sh` under pwsh on windows-latest exited
    # 0 in 150 milliseconds having printed nothing — no `==> test ./...` banner,
    # no `ok <package>` line, not one test executed. PowerShell does not run a
    # .sh file and does not say so; the step passed. The unit job was a green
    # Windows job that ran no tests, and the only thing in the whole build that
    # could have said so was the step beside it, which was the one crashing.
    #
    # `bash` on windows-latest is Git Bash, which ships on the image, so the
    # runner can be given the shell these steps were written for. The step below
    # then asserts the suite actually ran, so a future shell change cannot put
    # this job back to running nothing while reporting success.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: run the suite
        run: |
          set -o pipefail
          ./scripts/test.sh 2>&1 | tee "$RUNNER_TEMP/test.txt"
      # The "the suite ran" assertion, and it is not decoration. scripts/test.sh
      # prints `==> test ./…` before it hands a single package to `go test` and
      # `ok <package>` for every package that passes, so both of those are
      # properties of a run that happened. A step that cannot produce them has
      # not run the tests, whatever its exit code says — which is exactly what
      # the Windows cell did, silently, for as long as the step existed.
      #
      # `[[:space:]]` and not `\s`, because this step runs on the macOS cell too
      # and BSD grep's ERE has no `\s`: it would read the pattern as a literal
      # "oks", match nothing, and fail every macOS build over a typo in the
      # assertion that guards the assertion.
      - name: the suite actually ran
        run: |
          grep -q '^==> test ' "$RUNNER_TEMP/test.txt" || {
            echo "scripts/test.sh printed no banner: no tests were run."; exit 1; }
          grep -qE '^(ok|\?)[[:space:]]' "$RUNNER_TEMP/test.txt" || {
            echo "scripts/test.sh reported no package result: no tests were run."; exit 1; }
          echo "==> the suite ran: $(grep -cE '^(ok|\?)[[:space:]]' "$RUNNER_TEMP/test.txt") package results"
      - name: no test may write into the repository
        run: |
          test -z "$(git status --porcelain)" || \
            (echo "a test wrote into the repository:"; git status --porcelain; exit 1)

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: ./scripts/test.sh -race

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # One command, and that is the point. This step used to spell out
      # `./scripts/test.sh -coverprofile=coverage.out -covermode=atomic` while
      # the baseline it is compared against was recorded with `make cover`,
      # which passed no -covermode at all and whatever Go the developer happened
      # to have. Two commands for one measurement is how a ratchet ends up
      # comparing a number to itself and calling it a gate. `make cover` now
      # carries the profile path, the cover mode and the Go toolchain;
      # `coverage-check` below carries the tolerance. A bump is one line in the
      # Makefile and both sides move together.
      - name: measure coverage
        run: make cover
      # This step used to be `go tool cover -func=coverage.out | tail -1` under
      # the name "security-relevant packages must not lose coverage". It
      # printed a total, discarded it, and always passed — a gate whose output
      # nobody reads and whose exit code is always zero. AGENTS.md 5 asks for a
      # ratchet, so this is one: a per-package baseline, and a failure that
      # names the package and both numbers. See the header of
      # .coverage-baseline for why a ratchet and not an absolute floor.
      #
      # The baseline is recorded against a named Go toolchain and the gate
      # refuses to compare across toolchains, because the numbers are not
      # comparable across them: measured on one tree with one command,
      # internal/config reads 94.9% under go1.27.1 and 94.2% under go1.26.0, and
      # internal/plugin 92.4 against 91.7. `make coverage-check` says so out loud
      # rather than reporting a two-point DROP that looks like a lost test.
      - name: no tracked package lost coverage
        run: make coverage-check
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: coverage
          path: coverage.out
