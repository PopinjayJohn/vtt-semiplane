# The P12 hardening jobs: accessibility, benchmarks, and the load report.
#
# This file is deliberately separate from .github/workflows/ci.yml, which is the
# build-and-test gate. A quality gate and a correctness gate answer different
# questions and fail for different reasons, and merging them means every
# contributor waits on a Chromium download to learn that their Go code does not
# compile. It is also deliberately a *new file* rather than an extension of the
# existing ones: those were just rewritten, and a change to them is a change to
# what CI already promises.
#
# ## What gates and what only reports, and why the line falls there
#
#   a11y       GATE.   An accessibility error is a property of the markup: the
#                     same bytes in the same browser produce the same axe verdict
#                     on any machine, so a threshold of zero is a statement about
#                     the code rather than about the host.
#   benchmarks REPORT. A latency percentile is a property of the machine. See the
#                     long argument in scripts/bench.sh and scripts/loadtest.sh;
#                     the short form is that a shared runner's p99 is a statement
#                     about which other job the host was running.
#   loadtest   REPORT. Same reason, and a second one: it needs a booted binary
#                     and a generated 2k-page vault, so it is the slowest job here
#                     and the least informative per second of runner time.
#
# **The a11y job is a ratchet, not a pass/fail.** Its first run measured 162
# accessibility errors over six routes in two themes, and the cause was one line
# of CSS: the dark variant's media arm excluded the forced-light override with
# `:not(.light)`, which every element that merely lacks the class satisfies, so a
# light page loaded every dark utility and rendered 2.46:1 body text. That is
# fixed, and 152 of the errors went with it. What remains is a table of contents
# whose links address anchors the renderer does not emit, which is a defect in
# internal/md and not something this job can or should paper over.
#
# The job therefore fails when a route gets *worse* than `.pa11y-baseline` and
# passes when it is equal or better, printing both numbers. It is still a gate —
# it can fail, and it will — but it is not a permanent red, and the honest reason
# it is not is recorded here rather than in a `|| true`. Do not narrow the
# standard, add `|| true`, or drop a runner to make it quieter: lower a count by
# fixing what is wrong and re-record the baseline.
#
# There is no `e2e` job here, and its absence is a decision rather than an
# oversight: a browser end-to-end harness is a new toolchain, a new lockfile and
# a new flake surface, and the one case the plan names for it — two tabs on one
# page, an edit, and the second tab updating itself — is the live-push claim,
# which internal/httpapi already has a Go test for
# (TestPushAndFetchProduceIdenticalFragments). Building a browser harness here
# would have produced a job that had never run, and a CI job that cannot fail is
# worse than no CI job. It needs its own stage.

name: quality

on:
  push:
    branches: [main]
  pull_request:
  # Both reports are scheduled rather than pull-request-triggered, and the a11y
  # gate runs on a push and a pull request because it can fail for a reason
  # somebody must fix.
  schedule:
    # Sunday at 04:17 UTC. An off-the-hour minute is not superstition: the shared
    # runner fleet is a lot smaller at :00, and both report jobs here want a
    # quiet host.
    - cron: '17 4 * * 0'
  workflow_dispatch:

# One run per branch: a second push to a branch cancels the first rather than
# queueing behind it, so a five-minute job cannot be made a fifteen-minute wait.
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # One place for every tool version, so a bump is one line and CI and a
  # developer cannot drift. Read by scripts/pa11y.sh, scripts/loadtest.sh and
  # scripts/bench.sh; nothing parses it by hand.
  GO_VERSION: '1.26.0'
  # pa11y-ci 4.x requires an even-numbered Node of 20 or above. This is the only
  # Node in the repository and the only job that installs it: the build needs no
  # Node at all, because the stylesheet is generated by a standalone Tailwind
  # binary.
  NODE_VERSION: '24.21.0'

jobs:
  # ---------------------------------------------------------------------------
  # The accessibility gate. Runs a real binary against a generated vault, claims
  # the first administrator through the real form, and walks the routes in
  # pa11y.config.js in both themes with pa11y (axe + HTML CodeSniffer, WCAG2AA).
  # ---------------------------------------------------------------------------
  a11y:
    name: accessibility (WCAG 2.1 AA, both themes)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: install Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          # The repository's own modules; without this, setup-go would read
          # go.sum for the toolchain and download nothing useful.
          cache: false

      - name: install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: walk every reachable route in both themes
        # continue-on-error is deliberately absent. The gate is the gate: a run
        # with findings must fail this job, and the way to make it not fail is
        # to fix the templates.
        #
        # `set -o pipefail` is the load-bearing line. GitHub's default shell is
        # `bash -e`, which has no pipefail, so `./scripts/pa11y.sh | tee …`
        # would report *tee's* exit status and the gate would never fail — a
        # gate that cannot fail, reached by the shortest possible route.
        run: |
          set -o pipefail
          ./scripts/pa11y.sh 2>&1 | tee "$RUNNER_TEMP/a11y.txt"

      - name: publish the report
        # Always, so that a red job's numbers are in the summary rather than only
        # in the log a reader has to go and find.
        if: always()
        run: |
          {
            echo '## accessibility'
            echo
            echo 'WCAG2AA, runners axe + htmlcs, 1280x900, both themes,'
            echo 'six routes. A row the report calls NOT COVERED was refused by the'
            echo 'server and is not part of the claim.'
            echo
            echo '```'
            grep -E '^(  http|      [A-Za-z0-9]|pa11y measured|[0-9]+ of [0-9]+ rows|NOT COVERED)' \
              "$RUNNER_TEMP/a11y.txt" || true
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # The benchmark report. p50/p95/p99/max for the indexer over a real vault, for
  # search at 1k and 2k pages, and for a page render through the real router at
  # 2k pages. Never a gate: see the header.
  # ---------------------------------------------------------------------------
  benchmarks:
    name: benchmarks (report, no threshold)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    # A 1000-page reindex is ~9 seconds a pass and the httpapi fixture indexes
    # 2000 pages before its first iteration, so this is a slow job by design.
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: install Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: run the benchmarks
        # Not `continue-on-error`, and not a gate either: a benchmark that fails
        # to compile or deadlocks has found something, and the report is written
        # to a file so it survives the failure.
        # `set -o pipefail` for the same reason as the a11y gate: a pipeline
        # whose first stage fails is a failed stage, not a failed pipe.
        run: |
          set -o pipefail
          ./scripts/bench.sh 2>&1 | tee "$RUNNER_TEMP/bench.txt"

      - name: summarise
        if: always()
        run: |
          {
            echo '## benchmarks'
            echo
            echo 'Report only. There is no threshold: a latency percentile is a'
            echo "property of the machine, and the budget in"
            echo '`docs/ADR-0002-pure-go-sqlite.md` is compared by hand.'
            echo
            echo '```'
            grep -E '^(Benchmark|goos|goarch|cpu|==>)' "$RUNNER_TEMP/bench.txt" || true
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: upload the full output
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: benchmarks-${{ github.run_number }}
          path: ${{ runner.temp }}/bench.txt
          if-no-files-found: warn
          retention-days: 30

  # ---------------------------------------------------------------------------
  # The load report: the real binary, a real 2000-page vault, and `hey` against
  # /p/… and /api/search at concurrency 1 and at the host's cpu count. Never a
  # gate, for the same reason the benchmarks are not, and one reason more: the
  # interesting number is a comparison between two runs, and a gate compares one
  # run against a number.
  # ---------------------------------------------------------------------------
  loadtest:
    name: load test (report, no threshold)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: install Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: boot a 2k-page vault and measure the two budgeted routes
        run: |
          set -o pipefail
          ./scripts/loadtest.sh 2>&1 | tee "$RUNNER_TEMP/loadtest.txt"

      - name: summarise
        if: always()
        run: |
          {
            echo '## load test'
            echo
            echo 'Report only. Concurrency 1 is the row the P12 budget is'
            echo 'comparable to; the saturated rows are mostly queueing.'
            echo
            echo '```'
            grep -E '^(==> GET|---|  (Total|Slowest|Requests/sec|[0-9]+% in)|  \[)' \
              "$RUNNER_TEMP/loadtest.txt" || true
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: upload the full output
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: loadtest-${{ github.run_number }}
          path: ${{ runner.temp }}/loadtest.txt
          if-no-files-found: warn
          retention-days: 30
