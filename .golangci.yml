version: "2"

# Pinned action SHAs live in the workflow files, not here: zizmor fails a
# workflow that references a tag instead of a digest.

run:
  timeout: 15m

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - godot
    - misspell
    - nakedret
    - nilerr
    - noctx
    - revive
    - unconvert
    - usestdlibvars
    - wastedassign
  settings:
    godot:
      # Comments end in a period, except top-level declaration comments that
      # are the sentence themselves.
      scope: toplevel
      capital: false
    revive:
      rules:
        - name: exported
          arguments:
            - disableStutteringCheck
        - name: package-comments
        - name: unreachable-code
        - name: error-strings
    govet:
      enable:
        - shadow
    # staticcheck's QF* checks are quick-fix *suggestions* about how to write the
    # same thing, and several of them want this codebase's conditions made less
    # plain: De Morgan's law across a security predicate, and dropping the
    # embedded field name off a selector that reads better with it. The S1* and
    # ST1* checks — the ones that name a defect rather than a preference — stay
    # on, and they are the ones with teeth.
    staticcheck:
      checks:
        - all
        - -QF*
  exclusions:
      generated: lax
      rules:
        - path: _templ\.go$
          linters:
            - revive
            - gocritic
            - godot
        - path: internal/store/migrations/
          linters:
            - errcheck

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
